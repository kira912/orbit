<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Source of the PNG icons next to it: Orbit's mark on the night background. -->
  <defs>
    <linearGradient id="planet" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#7C5CFF" />
      <stop offset="0.5" stop-color="#5B6CF0" />
      <stop offset="1" stop-color="#22D3EE" />
    </linearGradient>
    <radialGradient id="sky" cx="0.3" cy="0.2" r="1">
      <stop offset="0" stop-color="#24184A" />
      <stop offset="0.6" stop-color="#161D3A" />
      <stop offset="1" stop-color="#0B1020" />
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)" />
  <g transform="translate(256 256)">
    <g transform="rotate(-24)">
      <ellipse rx="190" ry="72" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="10" />
      <circle cx="168" cy="34" r="20" fill="#22D3EE" />
    </g>
    <g transform="rotate(32)">
      <ellipse rx="150" ry="63" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="8" />
      <circle cx="-120" cy="-38" r="15" fill="#FF7AB6" />
    </g>
    <circle r="92" fill="url(#planet)" />
  </g>
</svg>
